[package]
name = "chaotic-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
log = "0.4.33"
anyhow = "1.0.104"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx-conditional-queries = { version = "0.4.0", features = ["sqlite"] }
