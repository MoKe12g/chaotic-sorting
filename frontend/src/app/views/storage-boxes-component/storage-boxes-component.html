<a routerLink="/storage-box/-1">Create Storage Box</a>

<p>Storage Boxes page {{ page }}</p>
@if (loaded) {
  <table mat-table [dataSource]="dataSource">
    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <!-- Place Column -->
    <ng-container matColumnDef="place">
      <th mat-header-cell *matHeaderCellDef>Place</th>
      <td mat-cell *matCellDef="let element">{{ element.place }}</td>
    </ng-container>

    <!-- Item Type Column -->
    <ng-container matColumnDef="item-type">
      <th mat-header-cell *matHeaderCellDef>Item Type</th>
      <td mat-cell *matCellDef="let element">{{ element.item_type }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [length]="elementCount"
    [pageSize]="entriesPerPage"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="updateTableContent()"
  />
} @else {
  <mat-progress-spinner mode="indeterminate" />
}
