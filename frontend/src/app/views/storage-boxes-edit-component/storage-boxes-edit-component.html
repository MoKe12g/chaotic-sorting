<p>Id "-1" means that the storage-box isn't created yet.</p>
<br />
<form>
  <table class="form-group">
    <tr>
      <td><label>Id</label></td>
      <td>
        <label>{{ storageBox.id }}</label>
      </td>
    </tr>
    <tr>
      <td><label>Place</label></td>
      <td>
        <mat-form-field>
          <input
            matInput
            (input)="logContent()"
            [(ngModel)]="storageBox.place"
            class="form-control"
            name="text_place"
            placeholder="Type the place here"
            required
            type="text"
          />
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td><label>Item type</label></td>
      <td>
        <mat-form-field>
          <input
            matInput
            (input)="logContent()"
            [(ngModel)]="storageBox.item_type"
            class="form-control"
            name="number_item_type"
            placeholder="Type the item type here"
            required
            type="number"
          />
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td>
        <br />
      </td>
    </tr>
    <tr>
      <td>
        @if (storageBox.id == -1) {
          <button matButton="filled" (click)="postStorageBox()">POST (insert)</button>
        }
      </td>
      <td>
        @if (storageBox.id != -1) {
          <button matButton="filled" (click)="patchStorageBox()">PATCH (update)</button>
        }
      </td>
      <td>
        @if (storageBox.id != -1) {
          <button matButton="tonal" (click)="deleteStorageBox()">DELETE</button>
        }
      </td>
    </tr>
  </table>
</form>
